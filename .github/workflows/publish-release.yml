name: Publish Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Test and build Windows executable
        shell: pwsh
        run: ./build.ps1
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.2"
          $asset = "dist/Sunucu-Kopyalama_v1.0.2.exe"
          if (-not (Test-Path -LiteralPath $asset)) {
            throw "Release asset was not produced: $asset"
          }
          gh release create $tag $asset --target $env:GITHUB_SHA --title "Sunucu Kopyalama v1.0.2" --notes-file RELEASE_NOTES_v1.0.2.md
